<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="280" fill="#14131a"/>

  <text x="600" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">RELEVANCE-GATED SALES DECISION</text>
  <text x="600" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">context-based decision, not a fixed script point</text>

  <!-- Box 1 -->
  <rect x="140" y="95" width="280" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="280" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Dialogue in progress</text>
  <text x="280" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">bot serves the client</text>

  <!-- Box 2 -->
  <rect x="460" y="95" width="280" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="600" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Relevance model</text>
  <text x="600" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">assesses dialogue</text>
  <text x="600" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">and client context</text>

  <!-- Box 3 -->
  <rect x="780" y="95" width="280" height="100" rx="6" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="920" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8e6e1" text-anchor="middle">Offer sent</text>
  <text x="920" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f" text-anchor="middle">only when relevant</text>

  <!-- Arrows -->
  <line x1="420" y1="145" x2="458" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="145" x2="778" y2="145" stroke="#c9a227" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="60" y1="205" x2="1140" y2="205" stroke="#3a3840" stroke-width="1"/>

  <!-- Stat callouts -->
  <text x="300" y="239" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c9a227" text-anchor="middle">6&#215;</text>
  <text x="300" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">NPV per user, statistically significant</text>

  <text x="900" y="239" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c9a227" text-anchor="middle">0.6M &#8594; 2.1M</text>
  <text x="900" y="257" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle">sales communications per month</text>
</svg>
